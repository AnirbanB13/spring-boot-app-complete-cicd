# Github Actions pipeline

name: Build-Test-Deploy

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/my-java-app

jobs:

  # --------------------------------------------------
  # 1. Build + Unit Tests
  # --------------------------------------------------
  build:
    name: Maven Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Build with Maven
        run: mvn clean install

  # --------------------------------------------------
  # 2. SonarQube Analysis
  # --------------------------------------------------
  sonarqube:
    name: SonarQube Analysis
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: SonarQube Scan
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=my-java-app \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # --------------------------------------------------
  # 3. Build + Push Docker Image
  # --------------------------------------------------
  docker:
    name: Build and push Docker image
    needs: [build, sonarqube]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag ${{ env.DOCKER_IMAGE }}:${{ steps.image.outputs.tag }} \
            .

      - name: Push Docker image
        run: docker push ${{ env.DOCKER_IMAGE }}:${{ steps.image.outputs.tag }}

  # --------------------------------------------------
  # 4. Update Kubernetes Manifest
  # --------------------------------------------------
  update-manifest:
    name: Update GitOps Manifest
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image
        run: echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Update manifest
        run: |
          sed -i 's|image: .*|image: ${{ env.DOCKER_IMAGE }}:${{ steps.image.outputs.tag }}|' k8s/deployment.yaml

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add k8s/deployment.yaml
          git commit -m "Update deployment image to ${{ steps.image.outputs.tag }}"
          git push
